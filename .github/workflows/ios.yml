name: App Store iPad screenshot

on:
  push:
    branches: [codex/ios-preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select and boot iPad Pro 13-inch simulator
        run: |
          device="$(xcrun simctl list -j devices available | jq -er '
            .devices["com.apple.CoreSimulator.SimRuntime.iOS-26-2"]
            | map(select(.name == "iPad Pro 13-inch (M5)" and .isAvailable))
            | first | .udid
          ')"
          echo "DEVICE=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"

      - name: Build and capture Staj Defteri
        run: |
          build="$RUNNER_TEMP/staj-build"
          xcodebuild build \
            -project StajDefteri.xcodeproj -scheme StajDefteri \
            -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" \
            -derivedDataPath "$build" CODE_SIGN_IDENTITY=-

          app="$build/Build/Products/Debug-iphonesimulator/StajDefteri.app"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl ui "$DEVICE" appearance light
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --wifiMode active --wifiBars 3 --batteryState unplugged --batteryLevel 100
          xcrun simctl install "$DEVICE" "$app"
          container="$(xcrun simctl get_app_container "$DEVICE" "$bundle_id" data)"
          folder="$container/Library/Application Support/StajDefteri"
          mkdir -p "$folder" "$RUNNER_TEMP/staj-store"
          cat > "$folder/journal.json" <<'JSON'
          {"version":1,"internships":[{"id":"09407D82-8C9B-47A2-B15C-31FEDB8B6DA1","studentName":"Deniz Kaya","school":"Örnek Teknik Üniversite","department":"Makine Mühendisliği","studentNumber":"20260001","workplace":"Üretim Atölyesi","startDate":"2026-11-02","endDate":"2026-11-27","entries":[]},{"id":"6605824F-8410-427F-8EC5-D85FAA688770","studentName":"Deniz Kaya","school":"Örnek Teknik Üniversite","department":"Makine Mühendisliği","studentNumber":"20260001","workplace":"Tasarım Laboratuvarı","startDate":"2026-07-06","endDate":"2026-07-31","entries":[]}]}
          JSON
          xcrun simctl launch "$DEVICE" "$bundle_id" -AppleLanguages '(tr)' -AppleLocale tr_TR
          sleep 4
          shot="$RUNNER_TEMP/staj-store/Staj-Defteri-iPad-13.png"
          xcrun simctl io "$DEVICE" screenshot "$shot"
          sips -g pixelWidth -g pixelHeight -g hasAlpha "$shot"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staj-defteri-ipad-13
          path: ${{ runner.temp }}/staj-store/Staj-Defteri-iPad-13.png
          if-no-files-found: error
          retention-days: 7
