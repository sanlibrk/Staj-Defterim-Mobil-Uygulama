name: iPhone interface preview

on:
  push:
    branches: [codex/ios-preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start iPhone 16 simulator
        shell: bash
        run: |
          device="$(xcrun simctl list -j devices available | jq -er '
            .devices["com.apple.CoreSimulator.SimRuntime.iOS-26-2"]
            | map(select(.name == "iPhone 16" and .isAvailable))
            | first | .udid
          ')"
          echo "DEVICE=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
          xcrun simctl status_bar "$device" override --time "9:41" --batteryState unplugged --batteryLevel 100 || true

      - name: Build the SwiftUI app and UI tests
        run: |
          xcodebuild build-for-testing \
            -project StajDefteri.xcodeproj -scheme StajDefteri \
            -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/staj-build" CODE_SIGN_IDENTITY=-

      - name: Capture the internship list with synthetic data
        run: |
          app="$RUNNER_TEMP/staj-build/Build/Products/Debug-iphonesimulator/StajDefteri.app"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")"
          echo "BUNDLE_ID=$bundle_id" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --batteryState unplugged --batteryLevel 100 || true
          xcrun simctl install "$DEVICE" "$app"
          container="$(xcrun simctl get_app_container "$DEVICE" "$bundle_id" data)"
          folder="$container/Library/Application Support/StajDefteri"
          mkdir -p "$folder" "$RUNNER_TEMP/staj-preview"
          cat > "$folder/journal.json" <<'JSON'
          {"version":1,"internships":[{"id":"09407D82-8C9B-47A2-B15C-31FEDB8B6DA1","studentName":"Deniz Kaya","school":"Örnek Teknik Üniversite","department":"Makine Mühendisliği","studentNumber":"20260001","workplace":"Üretim Atölyesi","startDate":"2026-11-02","endDate":"2026-11-27","entries":[]},{"id":"6605824F-8410-427F-8EC5-D85FAA688770","studentName":"Deniz Kaya","school":"Örnek Teknik Üniversite","department":"Makine Mühendisliği","studentNumber":"20260001","workplace":"Tasarım Laboratuvarı","startDate":"2026-07-06","endDate":"2026-07-31","entries":[]}]}
          JSON
          xcrun simctl launch "$DEVICE" "$bundle_id"
          sleep 3
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/staj-preview/Stajlar.png"
          xcrun simctl terminate "$DEVICE" "$bundle_id"
          xcrun simctl uninstall "$DEVICE" "$bundle_id"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staj-defteri-stajlar
          path: ${{ runner.temp }}/staj-preview/Stajlar.png
          if-no-files-found: error
          retention-days: 2

      - name: Capture in-app flows through XCUITest
        run: |
          xcodebuild test-without-building \
            -project StajDefteri.xcodeproj -scheme StajDefteri \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/staj-build" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/StajPreview.xcresult"

      - name: Export screenshots
        if: always()
        run: |
          result="$RUNNER_TEMP/StajPreview.xcresult"
          if [[ -d "$result" ]]; then
            xcrun xcresulttool export attachments \
              --path "$result" --output-path "$RUNNER_TEMP/staj-attachments"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: staj-defteri-ekranlar
          path: ${{ runner.temp }}/staj-attachments/
          retention-days: 2
